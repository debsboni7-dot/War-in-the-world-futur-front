name: Validate browser game
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/models/**'
      - '.github/workflows/validate-game.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/models/**'
      - '.github/workflows/validate-game.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax and referenced model files
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script type="module">');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('No module script found in index.html');
          const js = html.slice(start + '<script type="module">'.length, end);
          fs.writeFileSync('/tmp/game-check.mjs', js);
          const refs = [...html.matchAll(/['"](assets\/models\/[^'"]+)['"]/g)].map(m => m[1]);
          const requiredCameraRules = [
            ['independent player facing', /if\s*\(mag\s*>\s*\.08\)\s*\{[^}]*playerYaw\s*=\s*Math\.atan2/s],
            ['player rotation uses facing state, not camera yaw', /player\.rotation\.y\s*=\s*playerYaw\s*;/],
            ['camera shoulder offset', /const shoulder=aiming\s*\?\s*1\.05\s*:\s*1\.2/],
            ['shots follow camera crosshair', /ray\.setFromCamera\(new THREE\.Vector2\(0,0\),camera\)/],
            ['instanced forest geometry', /new THREE\.InstancedMesh\(tree(?:Trunk|Crown)Geometry,tree(?:Trunk|Crown)Material,treeCount\)/],
            ['reduced mobile render scale', /isLowMemoryPhone\?0\.7:0\.9/]
          ];
          for (const [label, pattern] of requiredCameraRules) if (!pattern.test(html)) throw new Error('Camera/gameplay regression: ' + label);
          console.log('Verified independent player facing, shoulder camera, and crosshair-aligned shots.');
          const missing = [...new Set(refs)].filter(path => !fs.existsSync(path));
          if (missing.length) throw new Error('Missing model files:\n' + missing.join('\n'));
          console.log('JavaScript module extracted. Verified ' + new Set(refs).size + ' referenced model paths.');
          NODE
          node --check /tmp/game-check.mjs
      - name: Install browser smoke-test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Launch the game in headless Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/war-game-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--no-sandbox','--enable-webgl','--ignore-gpu-blocklist','--use-gl=angle','--use-angle=swiftshader']});
            const page = await browser.newPage({viewport:{width:1280,height:800}});
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(12000);
            const result = await page.evaluate(() => ({
              canvas: !!document.querySelector('#game canvas'),
              canvasSize: (() => { const c=document.querySelector('#game canvas'); return c ? [c.width,c.height] : [0,0] })(),
              fps: document.querySelector('#fps')?.textContent || '',
              ammo: document.querySelector('#ammo')?.textContent || '',
              message: document.querySelector('#message')?.textContent || '',
              fatal: !!document.querySelector('#message') && getComputedStyle(document.querySelector('#message')).zIndex === '1000'
            }));
            const fire = page.locator('#fire');
            const reload = page.locator('#reload');
            await fire.dispatchEvent('pointerdown', {pointerId: 71, pointerType: 'touch', bubbles: true, cancelable: true});
            await fire.dispatchEvent('pointerdown', {pointerId: 72, pointerType: 'touch', bubbles: true, cancelable: true});
            const afterTwoShots = await page.locator('#ammo').textContent();
            await reload.dispatchEvent('pointerdown', {pointerId: 73, pointerType: 'touch', bubbles: true, cancelable: true});
            const afterReload = await page.locator('#ammo').textContent();
            await page.locator('#aim').click();
            const aimEnabled = await page.locator('#aim').evaluate(el => el.classList.contains('active'));
            console.log(JSON.stringify({result,afterTwoShots,afterReload,aimEnabled,pageErrors},null,2));
            if (!result.canvas || result.canvasSize[0] < 1 || result.canvasSize[1] < 1) throw new Error('Game canvas did not initialize');
            if (pageErrors.length) throw new Error('Browser JavaScript errors: ' + pageErrors.join(' | '));
            if (result.fatal) throw new Error('Game startup displayed a fatal error: ' + result.message);
            if (afterTwoShots !== '28/120') throw new Error('Firing did not consume exactly two rounds: ' + afterTwoShots);
            if (afterReload !== '30/118') throw new Error('Reload did not consume reserve ammo correctly: ' + afterReload);
            if (!aimEnabled) throw new Error('Aim button did not activate');
            // A second, portrait-sized run catches mobile layout/startup regressions.
            const mobile = await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const mobileErrors = [];
            mobile.on('pageerror', error => mobileErrors.push(String(error)));
            await mobile.goto('http://127.0.0.1:4173/index.html', {waitUntil:'domcontentloaded',timeout:45000});
            await mobile.waitForTimeout(8000);
            const mobileState = await mobile.evaluate(() => {
              const canvas=document.querySelector('#game canvas');
              const visible=id=>{const el=document.querySelector(id);if(!el)return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).display!=='none'};
              return {canvas:!!canvas&&canvas.width>0&&canvas.height>0,stick:visible('#stick'),fire:visible('#fire'),jump:visible('#jump'),reload:visible('#reload'),aim:visible('#aim'),run:visible('#run'),message:document.querySelector('#message')?.textContent||''};
            });
            console.log(JSON.stringify({mobileState,mobileErrors},null,2));
            await mobile.close();
            if (!mobileState.canvas) throw new Error('Mobile canvas did not initialize');
            for (const control of ['stick','fire','jump','reload','aim','run']) if (!mobileState[control]) throw new Error('Mobile control not visible: '+control);
            if (mobileErrors.length) throw new Error('Mobile JavaScript errors: '+mobileErrors.join(' | '));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
