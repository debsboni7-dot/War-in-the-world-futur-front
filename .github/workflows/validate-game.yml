name: Validate browser game
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/models/**'
      - '.github/workflows/validate-game.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/models/**'
      - '.github/workflows/validate-game.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax and referenced model files
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script type="module">');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('No module script found in index.html');
          const js = html.slice(start + '<script type="module">'.length, end);
          fs.writeFileSync('/tmp/game-check.mjs', js);
          const refs = [...html.matchAll(/['"](assets\/models\/[^'"]+)['"]/g)].map(m => m[1]);
          const missing = [...new Set(refs)].filter(path => !fs.existsSync(path));
          if (missing.length) throw new Error('Missing model files:\n' + missing.join('\n'));
          console.log('JavaScript module extracted. Verified ' + new Set(refs).size + ' referenced model paths.');
          NODE
          node --check /tmp/game-check.mjs
