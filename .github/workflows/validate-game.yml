name: Validate browser game
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/models/**'
      - '.github/workflows/validate-game.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/models/**'
      - '.github/workflows/validate-game.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax and referenced model files
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script type="module">');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('No module script found in index.html');
          const js = html.slice(start + '<script type="module">'.length, end);
          fs.writeFileSync('/tmp/game-check.mjs', js);
          const refs = [...html.matchAll(/['"](assets\/models\/[^'"]+)['"]/g)].map(m => m[1]);
          const requiredCameraRules = [
            ['independent player facing', /if\s*\(mag\s*>\s*\.08\)\s*\{[^}]*playerYaw\s*=\s*Math\.atan2/s],
            ['player rotation uses facing state, not camera yaw', /player\.rotation\.y\s*=\s*playerYaw\s*;/],
            ['camera shoulder offset', /const shoulder=aiming\s*\?\s*1\.05\s*:\s*1\.2/],
            ['shots follow camera crosshair', /ray\.setFromCamera\(new THREE\.Vector2\(0,0\),camera\)/],
            ['tree-free urban map', /Urban combat zone: no trees or forest vegetation in the city map/],
            ['solid city collisions', /for\(const b of abandonedBuildings\)[\s\S]*?for\(const d of doorInteractables\)/],
            ['adaptive render scale for 29 FPS target', /measuredFps<29[\s\S]*renderScale-.05/],
            ['reduced mobile render scale', /isLowMemoryPhone\?0\.55:0\.78/]
          ];
          for (const [label, pattern] of requiredCameraRules) if (!pattern.test(html)) throw new Error('Camera/gameplay regression: ' + label);
          console.log('Verified independent player facing, shoulder camera, and crosshair-aligned shots.');
          const optionalGenerated = new Set(['assets/models/generated/ogo-player-character-rigged-animated.glb','assets/models/generated/ogo-walking-meshy.glb','assets/models/generated/ogo-running-meshy.glb','assets/models/generated/segment-route-asphalte-abimee-v2.glb','assets/models/generated/moto-militaire-futuriste-v2.glb','assets/models/generated/ogo-player-character-v2.glb']);
          const missing = [...new Set(refs)].filter(path => !fs.existsSync(path) && !optionalGenerated.has(path));
          if (missing.length) throw new Error('Missing model files:\n' + missing.join('\n'));
          console.log('JavaScript module extracted. Verified ' + (new Set(refs).size-missing.length) + ' present model paths; optional Meshy models have procedural fallbacks.');
          for (const [label,pattern] of [['contextual bike interaction',/mountButton\.classList\.toggle\('visible',ridingBike\|\|distBike<3\.1\)/],['weapon pickup interaction',/pickupButton\.classList\.toggle\('visible',!!weaponPickup\?\.visible&&distWeapon<2\.5\)/],['interactive doors',/interactButton\.addEventListener\('pointerdown'/],['solid building and door collisions',/for\(const b of abandonedBuildings\)[\s\S]*?for\(const d of doorInteractables\)/],['visible bullet tracer',/const bulletTracer=new THREE\.Line/],['mounting keeps player visible',/playerModelVisibility\(true\);setMountTransition\('mount'\)/],['high-resolution textures',/isLowMemoryPhone\?'2k':'4k'/],['no primitive soldier fallback',/placeholderParts\.forEach\(p=>p\.visible=false\);gun\.visible=false;showMessage\('Field test ready/]]) if(!pattern.test(html)) throw new Error('Missing required gameplay/visual feature: '+label);
          NODE
          node --check /tmp/game-check.mjs
      - name: Install browser smoke-test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Launch the game in headless Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/war-game-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--no-sandbox','--enable-webgl','--ignore-gpu-blocklist','--use-gl=angle','--use-angle=swiftshader']});
            const page = await browser.newPage({viewport:{width:1280,height:800}});
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(12000);
            await page.waitForFunction(() => typeof window.__warPlayerTestState==='function' && ['Meshy Ogo Rigged+Animated GLB','Meshy Ogo GLB'].includes(window.__warPlayerTestState().modelSource), null, {timeout:30000});
            await page.waitForFunction(() => {const s=window.__warWorldAssetTestState?.();return !!s&&s.abandonedBuildingModelReady&&s.generatedRoadModelReady&&s.bikeModelReady}, null, {timeout:45000});
            await page.screenshot({path:'/tmp/war-game-preview.png'});
            const result = await page.evaluate(() => ({
              worldAssets: typeof window.__warWorldAssetTestState==='function'?window.__warWorldAssetTestState():null,
              canvas: !!document.querySelector('#game canvas'),
              canvasSize: (() => { const c=document.querySelector('#game canvas'); return c ? [c.width,c.height] : [0,0] })(),
              fps: document.querySelector('#fps')?.textContent || '',
              player: typeof window.__warPlayerTestState==='function'?window.__warPlayerTestState():null,
              ammo: document.querySelector('#ammo')?.textContent || '',
              message: document.querySelector('#message')?.textContent || '',
              fatal: !!document.querySelector('#message') && getComputedStyle(document.querySelector('#message')).zIndex === '1000'
            }));
            const fire = page.locator('#fire');
            const reload = page.locator('#reload');
            await fire.dispatchEvent('pointerdown', {pointerId: 71, pointerType: 'touch', bubbles: true, cancelable: true});
            await fire.dispatchEvent('pointerdown', {pointerId: 72, pointerType: 'touch', bubbles: true, cancelable: true});
            const afterTwoShots = await page.locator('#ammo').textContent();
            await reload.dispatchEvent('pointerdown', {pointerId: 73, pointerType: 'touch', bubbles: true, cancelable: true});
            const afterReload = await page.locator('#ammo').textContent();
            await page.locator('#aim').click();
            const aimEnabled = await page.locator('#aim').evaluate(el => el.classList.contains('active'));
            console.log(JSON.stringify({result,afterTwoShots,afterReload,aimEnabled,pageErrors},null,2));
            if (!result.canvas || result.canvasSize[0] < 1 || result.canvasSize[1] < 1) throw new Error('Game canvas did not initialize');
            if (result.player && result.player.placeholderVisible) throw new Error('Primitive placeholder soldier must remain hidden');
            if (result.player && result.player.modelSource !== 'Meshy Ogo GLB') throw new Error('Generated human Ogo model was not loaded: '+result.player.modelSource);
            if (result.player && result.player.playerVisibleMeshes===0) throw new Error('No visible 3D mesh found under the player root');
            if (pageErrors.length) throw new Error('Browser JavaScript errors: ' + pageErrors.join(' | '));
            if (result.fatal) throw new Error('Game startup displayed a fatal error: ' + result.message);
            if (afterTwoShots !== '28/120') throw new Error('Firing did not consume exactly two rounds: ' + afterTwoShots);
            if (afterReload !== '30/118') throw new Error('Reload did not consume reserve ammo correctly: ' + afterReload);
            if (!aimEnabled) throw new Error('Aim button did not activate');
            // Exercise the real pointer-look handler and assert camera yaw is independent from player facing.
            await page.waitForFunction(() => typeof window.__warCameraTestState === 'function');
            const cameraBefore = await page.evaluate(() => window.__warCameraTestState());
            await page.mouse.move(700, 400);
            await page.mouse.down();
            await page.mouse.move(760, 420, {steps: 5});
            await page.mouse.up();
            await page.waitForTimeout(350);
            const cameraAfterLook = await page.evaluate(() => window.__warCameraTestState());
            const yawDelta = Math.abs(cameraAfterLook.yaw-cameraBefore.yaw);
            const facingDelta = Math.abs(cameraAfterLook.playerRotation-cameraBefore.playerRotation);
            const shoulderDistance = Math.hypot(cameraAfterLook.cameraX-cameraAfterLook.playerX,cameraAfterLook.cameraZ-cameraAfterLook.playerZ);
            console.log(JSON.stringify({cameraBefore,cameraAfterLook,yawDelta,facingDelta,shoulderDistance},null,2));
            if (yawDelta < 0.05) throw new Error('Pointer drag did not rotate the camera');
            if (facingDelta > 0.001) throw new Error('Player facing changed when only the camera was rotated');
            if (shoulderDistance < 3 || shoulderDistance > 9) throw new Error('Over-shoulder camera distance outside expected range: '+shoulderDistance);
            // A second, portrait-sized run catches mobile layout/startup regressions.
            const mobile = await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const mobileErrors = [];
            mobile.on('pageerror', error => mobileErrors.push(String(error)));
            await mobile.goto('http://127.0.0.1:4173/index.html', {waitUntil:'domcontentloaded',timeout:45000});
            await mobile.waitForTimeout(8000);
            const mobileState = await mobile.evaluate(() => {
              const canvas=document.querySelector('#game canvas');
              const visible=id=>{const el=document.querySelector(id);if(!el)return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).display!=='none'};
              return {canvas:!!canvas&&canvas.width>0&&canvas.height>0,stick:visible('#stick'),fire:visible('#fire'),jump:visible('#jump'),reload:visible('#reload'),aim:visible('#aim'),run:visible('#run'),message:document.querySelector('#message')?.textContent||'',fps:document.querySelector('#fps')?.textContent||'--'};
            });
            // Exercise the actual mobile joystick and verify that it moves the player, not just that it is visible.
            const mobileBeforeMove = await mobile.evaluate(() => window.__warCameraTestState());
            const stickBox = await mobile.locator('#stick').boundingBox();
            if (!stickBox) throw new Error('Mobile joystick has no measurable hit area');
            const stickX = stickBox.x + stickBox.width/2, stickY = stickBox.y + stickBox.height/2;
            await mobile.mouse.move(stickX,stickY);
            await mobile.mouse.down();
            await mobile.mouse.move(stickX,stickY-35,{steps:4});
            await mobile.waitForTimeout(900);
            const mobileAfterMove = await mobile.evaluate(() => window.__warCameraTestState());
            await mobile.mouse.up();
            const playerTravel = Math.hypot(mobileAfterMove.playerX-mobileBeforeMove.playerX,mobileAfterMove.playerZ-mobileBeforeMove.playerZ);
            console.log(JSON.stringify({mobileState,mobileBeforeMove,mobileAfterMove,playerTravel,mobileErrors},null,2));
            await mobile.close();
            if (!mobileState.canvas) throw new Error('Mobile canvas did not initialize');
            for (const control of ['stick','fire','jump','reload','aim','run']) if (!mobileState[control]) throw new Error('Mobile control not visible: '+control);
            if (mobileErrors.length) throw new Error('Mobile JavaScript errors: '+mobileErrors.join(' | '));
            if (playerTravel < 0.2) throw new Error('Mobile joystick did not move the player; travelled '+playerTravel);
            // Test proximity-only interaction buttons and their real pointer handlers.
            await page.evaluate(() => window.__warInteractionTest.moveNearBike());
            const bikeVisibleNear = await page.locator('#mountBike').evaluate(el => el.classList.contains('visible'));
            await page.locator('#mountBike').dispatchEvent('pointerdown',{pointerId:91,pointerType:'touch',bubbles:true,cancelable:true});
            const mounted = await page.evaluate(() => window.__warPlayerTestState().ridingBike);
            await page.locator('#mountBike').dispatchEvent('pointerdown',{pointerId:92,pointerType:'touch',bubbles:true,cancelable:true});
            const dismounted = !(await page.evaluate(() => window.__warPlayerTestState().ridingBike));
            await page.evaluate(() => window.__warInteractionTest.moveNearWeapon());
            const pickupVisibleNear = await page.locator('#pickupWeapon').evaluate(el => el.classList.contains('visible'));
            const ammoBeforePickup = await page.locator('#ammo').textContent();
            await page.locator('#pickupWeapon').dispatchEvent('pointerdown',{pointerId:93,pointerType:'touch',bubbles:true,cancelable:true});
            const ammoAfterPickup = await page.locator('#ammo').textContent();
            console.log(JSON.stringify({bikeVisibleNear,mounted,dismounted,pickupVisibleNear,ammoBeforePickup,ammoAfterPickup},null,2));
            if(!bikeVisibleNear||!mounted||!dismounted) throw new Error('Motorcycle proximity/mount interaction failed');
            if(!pickupVisibleNear||ammoAfterPickup===ammoBeforePickup) throw new Error('Weapon pickup interaction failed');
            if (mobileState.fps === '0') console.warn('WARNING: Chromium software-rendered FPS counter is 0; this is not a real-device FPS benchmark.');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Upload visual smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: war-game-preview
          path: /tmp/war-game-preview.png
          if-no-files-found: ignore
