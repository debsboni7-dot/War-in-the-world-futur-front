<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>War in the World: Future Front</title>
<style>
:root{color-scheme:dark;--panel:rgba(8,17,24,.82);--line:rgba(180,220,230,.25);--accent:#ffb547}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111c23;color:#edf5f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.brand,.status,.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);border-radius:12px;padding:10px 12px}.brand strong{display:block;font-size:clamp(12px,3.5vw,17px);letter-spacing:.04em}.brand small{color:#9fb8c0;font-size:11px}.status{font-size:12px;line-height:1.7;text-align:right}.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.hint{max-width:52%;font-size:11px;color:#c2d1d5;background:var(--panel);padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.controls{pointer-events:auto;display:flex;gap:8px;align-items:flex-end}.btn{border:1px solid var(--line);background:rgba(9,19,26,.88);color:#fff;border-radius:14px;min-width:56px;min-height:54px;padding:8px;font-weight:700;font-size:11px;touch-action:none}.btn:active,.btn.active{border-color:var(--accent);background:rgba(106,70,24,.88)}#stick{pointer-events:auto;width:112px;height:112px;border:1px solid #8da6ad88;border-radius:50%;background:#07121a88;position:relative;touch-action:none;flex-shrink:0}#knob{position:absolute;left:50%;top:50%;width:42px;height:42px;transform:translate(-50%,-50%);border-radius:50%;background:#d6e2e5aa;border:1px solid #fff8}
#message{position:fixed;left:50%;top:25%;transform:translateX(-50%);background:#08131ddd;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:13px;max-width:85%;text-align:center;display:none}
@media(min-width:800px){.hud{padding:20px}.btn{min-width:68px;min-height:58px}.hint{font-size:13px}}

<body>
<div id="game"></div>
<div class="hud">
 <div class="top">
  <div class="brand"><strong>WAR IN THE WORLD</strong><small>FUTURE FRONT · FIELD TEST</small></div>
  <div class="status"><div>MISSION <b id="mission">01</b></div><div>ENERGY <b id="energy">100%</b></div><div>FPS <b id="fps">--</b></div></div>
 </div>
 <div class="bottom">
  <div id="stick" aria-label="Movement joystick"><div id="knob"></div></div>
  <div class="hint">Move with the joystick. Drag the open screen to look around. Tap FIRE to test your weapon.</div>
  <div class="controls"><button class="btn" id="aim">LOOK</button><button class="btn" id="fire">FIRE</button><button class="btn" id="run">SPRINT</button></div>
 </div>
</div>
<div id="message"></div>
<script type="module">
const root=document.querySelector('#game'),message=document.querySelector('#message');
const isLowMemoryPhone = (navigator.deviceMemory && navigator.deviceMemory <= 4) || innerWidth < 500;
function showMessage(t){message.textContent=t;message.style.display='block';clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>message.style.display='none',2200)}
let THREE;
try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js')}catch(e){showMessage('3D engine could not load. Check your internet connection and reload.');throw e}
let FBXLoader=null;
try{({FBXLoader}=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js'))}catch(e){console.warn('Optional FBX loader unavailable; using lightweight weapon placeholder.',e)}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bb5bd);scene.fog=new THREE.Fog(0x9bb5bd,38,115);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,isLowMemoryPhone?0.85:1.1));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdceeff,0x4b5945,2.0));const sun=new THREE.DirectionalLight(0xffe1b0,2.0);sun.position.set(-18,32,12);scene.add(sun);
// Lightweight procedural ground texture: generated locally, no external asset/license dependency.
function makeNoiseTexture(base,seed=1,repeat=1,detail='grain'){
 const c=document.createElement('canvas');c.width=c.height=256;const ctx=c.getContext('2d');
 ctx.fillStyle=base;ctx.fillRect(0,0,256,256);
 let n=seed;const rand=()=>{n=(n*1664525+1013904223)>>>0;return n/4294967296};
 const count=detail==='metal'?900:detail==='bark'?950:detail==='foliage'?1800:2600;for(let i=0;i<count;i++){const a=.04+rand()*(detail==='metal'?.16:.2);ctx.fillStyle=rand()>.5?('rgba(210,205,170,'+a+')'):('rgba(8,15,12,'+a+')');if(detail==='bark'){ctx.fillRect(rand()*256,rand()*256,1+rand()*3,8+rand()*34)}else if(detail==='foliage'){ctx.beginPath();ctx.ellipse(rand()*256,rand()*256,2+rand()*5,1+rand()*3,rand()*Math.PI,0,Math.PI*2);ctx.fill()}else{const w=detail==='metal'?2+rand()*18:1+rand()*4;ctx.fillRect(rand()*256,rand()*256,w,detail==='metal'?1+rand()*3:w)}}
 if(detail==='concrete'){ctx.strokeStyle='rgba(12,20,22,.25)';ctx.lineWidth=2;ctx.strokeRect(8,8,240,240);ctx.beginPath();ctx.moveTo(0,128);ctx.lineTo(256,128);ctx.stroke()}
 if(detail==='metal'){ctx.strokeStyle='rgba(220,230,230,.24)';ctx.lineWidth=3;for(let y=18;y<256;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(256,y);ctx.stroke()}}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat,repeat);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=1;return t;
}
const groundTex=makeNoiseTexture('#526b48',17,24,'grain');
const concreteTex=makeNoiseTexture('#68757a',23,1,'concrete');
const metalTex=makeNoiseTexture('#263b46',31,1,'metal');
const barkTex=makeNoiseTexture('#57432e',47,1,'bark');

const foliageTex=makeNoiseTexture('#34583b',59,2,'foliage');
// Real photographic CC0 base-color maps from Poly Haven. Procedural maps remain as an offline fallback.
function loadPhotoTexture(url,repeat,kind){
 const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');
 loader.load(url,(tex)=>{
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(repeat,repeat);
  tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=1;tex.generateMipmaps=true;
  scene.traverse((obj)=>{if(obj.isMesh&&obj.material&&obj.material.userData&&obj.material.userData.photoKind===kind){obj.material.map=tex;obj.material.needsUpdate=true}});
 },undefined,(err)=>console.warn('Photographic texture unavailable; procedural fallback retained:',kind));
}

const groundMat=new THREE.MeshStandardMaterial({map:groundTex,color:0xffffff,roughness:1});groundMat.userData.photoKind='ground';const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240,1,1),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);
// Debug grid removed for a cleaner continuous battlefield terrain.
function box(w,h,d,color,x,y,z,texture=null){const mat=new THREE.MeshStandardMaterial({color,map:texture,roughness:texture===metalTex?.68:.9,metalness:texture===metalTex?.35:0});if(texture===concreteTex)mat.userData.photoKind='concrete';if(texture===metalTex)mat.userData.photoKind='metal';const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m);return m}
function tree(x,z,s=1){box(.35*s,2*s,.35*s,0xffffff,x,s,z,barkTex);const crown=new THREE.Mesh(new THREE.ConeGeometry(1.25*s,3*s,6),new THREE.MeshStandardMaterial({color:0xffffff,map:foliageTex,roughness:1}));crown.position.set(x,2.6*s,z);scene.add(crown)}
for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,r=13+Math.random()*65,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<7&&Math.abs(z)<9)continue;tree(x,z,.65+Math.random()*.85)}
// Simple readable futuristic outpost structures

loadPhotoTexture('https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/gravel_embedded_concrete/gravel_embedded_concrete_diff_1k.jpg',24,'ground');
loadPhotoTexture('https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/concrete_floor/concrete_floor_diff_1k.jpg',2,'concrete');
loadPhotoTexture('https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/rusty_painted_metal/rusty_painted_metal_diff_1k.jpg',2,'metal');
for(let i=0;i<9;i++){let x=(i%3-1)*9,z=-16-Math.floor(i/3)*7;box(4,2.5,3,0xffffff,x,1.25,z,concreteTex);box(4.2,.25,3.2,0xffffff,x,2.6,z,metalTex);box(.15,1.1,.15,0xffa640,x-1.4,1.3,z+1.56);box(.15,1.1,.15,0xffa640,x+1.4,1.3,z+1.56)}
// Player movement root: the military FBX is the visible character when loaded.
const player=new THREE.Group();scene.add(player);
const suit=new THREE.MeshStandardMaterial({color:0x344b59,roughness:.72}),armor=new THREE.MeshStandardMaterial({color:0x9ba9ad,metalness:.45,roughness:.48}),visor=new THREE.MeshStandardMaterial({color:0x32c9d0,metalness:.35,roughness:.25,emissive:0x07545a});
function part(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);player.add(m);return m}
const placeholderParts=[];
placeholderParts.push(part(new THREE.CapsuleGeometry(.42,.8,3,6),suit,0,1.25,0));
placeholderParts.push(part(new THREE.SphereGeometry(.34,8,6),armor,0,2.05,0));
placeholderParts.push(part(new THREE.BoxGeometry(.45,.12,.08),visor,0,2.08,-.3));
placeholderParts.push(part(new THREE.BoxGeometry(.22,.7,.24),armor,-.55,1.3,0));
placeholderParts.push(part(new THREE.BoxGeometry(.22,.7,.24),armor,.55,1.3,0));
placeholderParts.push(part(new THREE.BoxGeometry(.3,.72,.32),suit,-.23,.4,0));
placeholderParts.push(part(new THREE.BoxGeometry(.3,.72,.32),suit,.23,.4,0));
const gun=new THREE.Mesh(new THREE.BoxGeometry(.14,.16,.8),new THREE.MeshStandardMaterial({color:0x252b30,metalness:.6,roughness:.4}));
gun.position.set(.58,1.25,-.45);player.add(gun);
let militaryModel=null, militaryMixer=null, militaryAnimations=[], weaponModel=null, weaponAnchor=null;
function findRightHand(rootModel){
 let found=null;
 rootModel.traverse(o=>{if(found||!o.isBone)return;const n=o.name.toLowerCase().replace(/[ _.-]/g,'');if(['righthand','handr','mixamorigrighthand','bip01rhand','rightwrist','handright'].includes(n)||(/right/.test(n)&&/hand/.test(n)))found=o});
 return found;
}
// Load the user's configured military character first. The movement root stays independent,
// so joystick/camera motion works even when the FBX contains no usable animation clips.
if(FBXLoader){
 const soldierLoader=new FBXLoader();
 soldierLoader.load('assets/models/robots/Meshy_AI_Create_a_realistic_futuristic_military_20261025_generate.fbx',model=>{
  try{
   const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());
   const maxDim=Math.max(size.x,size.y,size.z);
   if(!Number.isFinite(maxDim)||maxDim<.001)throw new Error('Invalid military model bounds');
   // Target human-scale height while preserving the model proportions.
   const height=Math.max(size.y,.001),scale=1.85/height;
   model.scale.setScalar(scale);
   model.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);
   model.traverse(o=>{
    if(!o.isMesh)return;o.frustumCulled=true;
    if(o.geometry?.attributes?.position)o.geometry.computeBoundingSphere();
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(mat=>{if(!mat)return;if(!mat.map){mat.map=metalTex;mat.color?.set(0xffffff);mat.userData=mat.userData||{};mat.userData.runtimeFallbackTexture=true}mat.roughness=Math.max(.48,mat.roughness??.75);mat.needsUpdate=true});
   });
   placeholderParts.forEach(p=>p.visible=false);militaryModel=model;player.add(model);
   if(model.animations&&model.animations.length){militaryAnimations=model.animations;militaryMixer=new THREE.AnimationMixer(model);const preferred=model.animations.find(a=>/idle|stand|breath/i.test(a.name))||model.animations[0];militaryMixer.clipAction(preferred).play();console.info('Military character animation:',preferred.name)}
   else console.info('Military character loaded; no embedded animation clips found.');
   // If the model has a named right-hand bone, re-parent the weapon there after it loads.
   if(weaponModel){attachWeaponToHand();}
   showMessage('Military character loaded');
  }catch(e){console.warn('Military character could not be prepared; placeholder retained.',e);model.parent?.remove(model)}
 },undefined,e=>{console.warn('Military FBX failed; placeholder retained.',e);showMessage('Military model failed to load; placeholder remains')});
}
function attachWeaponToHand(){
 if(!weaponModel||!militaryModel)return;
 const hand=findRightHand(militaryModel);
 if(hand){
  weaponModel.parent?.remove(weaponModel);hand.add(weaponModel);
  // Conservative hand grip placement; fine alignment can be tuned after a visual test.
  weaponModel.position.set(.04,-.025,-.12);weaponModel.rotation.set(0,Math.PI/2,0);
  weaponAnchor='right-hand bone';
 }else{
  weaponModel.parent?.remove(weaponModel);player.add(weaponModel);
  weaponModel.position.set(.38,1.22,-.34);weaponModel.rotation.set(0,0,0);
  weaponAnchor='fallback hand position';
 }

}
// Exactly one test weapon: the existing rotary FBX. Use the procedural gun only as fallback.
if(FBXLoader){
 const weaponLoader=new FBXLoader();
 weaponLoader.load('assets/models/weapons/Meshy_AI_Create_a_realistic_futuristic_rotary_20261025_generate.fbx',model=>{
  try{
   model.traverse(o=>{if(!o.isMesh)return;o.frustumCulled=true;const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(mat=>{if(!mat)return;if(!mat.map){mat.map=metalTex;mat.color?.set(0xffffff);mat.userData=mat.userData||{};mat.userData.proceduralFallbackTexture=true}mat.roughness=Math.max(.42,mat.roughness??.7);mat.metalness=Math.max(.18,mat.metalness??0);mat.needsUpdate=true})});
   const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),maxDim=Math.max(size.x,size.y,size.z);
   if(!Number.isFinite(maxDim)||maxDim<.0001)throw new Error('Invalid weapon bounds');
   model.scale.setScalar(.72/maxDim);weaponModel=model;attachWeaponToHand();
  }catch(e){console.warn('Weapon model invalid; using fallback.',e)}
 },undefined,e=>console.warn('Weapon FBX failed; using fallback gun.',e));
}
player.position.set(0,0,3);

// Progressive 3D asset streaming: only one extra model loads at a time.
// Large vehicles/robots stay out of the initial critical path on low-memory phones.
const streamedModels = [];
function loadWorldFBX(url, position, targetSize, label, maxBytesHint) {
  return new Promise(resolve => {
    if (!FBXLoader) return resolve(null);
    // Keep very large assets available in the repository but do not force them into RAM on mobile.
    if (isLowMemoryPhone && maxBytesHint > 4.5) {
      console.info('Deferred large asset on mobile:', label);
      return resolve(null);
    }
    const loader = new FBXLoader();
    loader.load(url, model => {
      try {
        const bounds = new THREE.Box3().setFromObject(model);
        const size = bounds.getSize(new THREE.Vector3());
        const center = bounds.getCenter(new THREE.Vector3());
        const largest = Math.max(size.x, size.y, size.z);
        if (!Number.isFinite(largest) || largest < 0.001) return resolve(null);
        model.scale.setScalar(targetSize / largest);
        model.position.set(position.x-center.x*model.scale.x, position.y-center.y*model.scale.y, position.z-center.z*model.scale.z);
        model.traverse(o => {
          if (!o.isMesh) return;
          o.frustumCulled = true;
          if (o.geometry) {
            if (o.geometry.attributes && o.geometry.attributes.position) o.geometry.computeBoundingSphere();
          }
          if (o.material) {
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            mats.forEach(mat => {
              if (!mat) return;
              if (!mat.map) { mat.map = metalTex; mat.userData = mat.userData || {}; mat.userData.runtimeFallback = true; }
              mat.roughness = Math.max(.48, mat.roughness ?? .75);
              mat.needsUpdate = true;
            });
          }
        });
        scene.add(model); streamedModels.push({model,label,position:new THREE.Vector3(position.x,position.y,position.z)});
        console.info('Streamed 3D asset:',label); resolve(model);
      } catch (e) { console.warn('Could not prepare asset', label, e); resolve(null); }
    }, undefined, err => { console.warn('Optional 3D asset failed; scene fallback retained:', label, err); resolve(null); });
  });
}
// Stream in the compact outpost and stealth vehicle after the first frame is already running.
setTimeout(async () => {
  await loadWorldFBX('assets/models/structures/Meshy_AI_Create_a_realistic_futuristic_20261025_generate.fbx', {x:0,y:0,z:-28}, 7, 'outpost structure', 2.8);
  await new Promise(r => setTimeout(r, 1200));
  await loadWorldFBX('assets/models/vehicles/Meshy_AI_Create_a_realistic_futuristic_stealth_20261025_generate.fbx', {x:8,y:0,z:-8}, 5, 'stealth vehicle', 2.7);
}, 2600);

// Reusable low-cost muzzle flash and pooled particles (no per-shot geometry allocation).
const vfxGroup = new THREE.Group(); scene.add(vfxGroup);
const flashMat = new THREE.MeshBasicMaterial({color:0xffd36a, transparent:true, opacity:0, depthWrite:false});
const muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(.12,6,5), flashMat);
vfxGroup.add(muzzleFlash);
const particleGeometry = new THREE.SphereGeometry(.035,4,3);
const particleMaterial = new THREE.MeshBasicMaterial({color:0xff9b3d, transparent:true, opacity:.9, depthWrite:false});
const particles = [];
for (let i=0;i<18;i++) {
  const mesh = new THREE.Mesh(particleGeometry, particleMaterial.clone());
  mesh.visible = false; vfxGroup.add(mesh);
  particles.push({mesh,life:0,velocity:new THREE.Vector3()});
}
let vfxClock = 0;
function triggerWeaponVFX() {
  const muzzle = new THREE.Vector3(.58,1.25,-.92).applyAxisAngle(new THREE.Vector3(0,1,0), yaw).add(player.position);
  muzzleFlash.position.copy(muzzle); muzzleFlash.scale.set(1.6,1.6,2.2); flashMat.opacity=.95; vfxClock=.075;
  let used=0;
  for (const p of particles) {
    if (p.life>0) continue;
    p.mesh.visible=true; p.life=.22+Math.random()*.16; p.mesh.position.copy(muzzle);
    p.velocity.set((Math.random()-.5)*2.4, Math.random()*1.8, -1.4-Math.random()*2.4).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
    if (++used>=7) break;
  }
}

let yaw=0,pitch=-.13,moveX=0,moveY=0,sprinting=false,energy=100,shots=0,last=performance.now(),frames=0,fpsStamp=last;
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let stickId=null,stickRect;
function setStick(e){stickRect=stick.getBoundingClientRect();const dx=e.clientX-(stickRect.left+stickRect.width/2),dy=e.clientY-(stickRect.top+stickRect.height/2),max=35,len=Math.hypot(dx,dy)||1;moveX=dx/Math.max(max,len);moveY=dy/Math.max(max,len);knob.style.left=(50+moveX*32)+'%';knob.style.top=(50+moveY*32)+'%'}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e)});function endStick(){stickId=null;moveX=moveY=0;knob.style.left='50%';knob.style.top='50%'}stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
let lookId=null,prevX=0,prevY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.28&&e.clientY>innerHeight*.55)return;lookId=e.pointerId;prevX=e.clientX;prevY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;yaw-=(e.clientX-prevX)*.004;pitch=Math.max(-.65,Math.min(.32,pitch-(e.clientY-prevY)*.003));prevX=e.clientX;prevY=e.clientY});function endLook(e){if(e.pointerId===lookId)lookId=null}renderer.domElement.addEventListener('pointerup',endLook);renderer.domElement.addEventListener('pointercancel',endLook);
document.querySelector('#run').addEventListener('pointerdown',()=>sprinting=true);for(const ev of ['pointerup','pointercancel','pointerleave'])document.querySelector('#run').addEventListener(ev,()=>sprinting=false);

function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,isLowMemoryPhone?0.85:1.1));renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
const clock=new THREE.Clock();
function animate(now){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);frames++;if(now-fpsStamp>1000){document.querySelector('#fps').textContent=Math.round(frames*1000/(now-fpsStamp));frames=0;fpsStamp=now}
